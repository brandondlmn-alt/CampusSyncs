name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Verify Project Structure (Debug)
      run: |
        ls -R app/src/main/java/com/campussync/app/utils/
        ls -R app/src/test/java/com/campussync/app/

    - name: Create local.properties
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

    - name: Decode google-services.json
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
        else
          echo "Warning: GOOGLE_SERVICES_JSON_BASE64 is missing"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
